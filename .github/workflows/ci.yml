name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test Node backend
        run: npm run test --workspace backend
      - name: Install desktop dependencies
        run: npm ci --prefix desktop-agent --ignore-scripts
      - name: Test desktop
        run: npm run test:desktop
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      VITE_API_URL: https://api.example.invalid
      VITE_WS_URL: wss://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci
      - run: npm run build --workspace frontend