services:
  - type: web
    name: store-listen-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DATABASE_NAME
        value: storelisten
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://store-listen-web-qkkv.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: ^$
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: POS_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: gridfs
      - key: AUDIO_RETENTION_DAYS
        value: "7"
      - key: TRANSCRIPT_RETENTION_DAYS
        value: "30"

  - type: web
    runtime: static
    name: store-listen-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://store-listen-api-z8yb.onrender.com
      - key: VITE_WS_URL
        value: wss://store-listen-api-z8yb.onrender.com
