services:
  - type: web
    name: store-listen-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: development
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DATABASE_NAME
        value: storelisten_render_demo
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: API_BASE_URL
        value: https://store-listen-api-z8yb.onrender.com
      - key: WEB_BASE_URL
        value: https://store-listen-web-qkkv.onrender.com
      - key: CORS_ORIGINS
        value: https://store-listen-web-qkkv.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: ^$
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Free fast STT: create a key at https://console.groq.com (no card needed).
      # Without GROQ_API_KEY / AI_API_KEY, SPEECH_PROVIDER=auto falls back to local Whisper (minutes).
      - key: GROQ_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SPEECH_API_KEY
        sync: false
      - key: SPEECH_PROVIDER
        value: auto
      - key: SPEECH_CLOUD_MODEL
        value: whisper-large-v3
      - key: WHISPER_TRANSLATE_SPANISH
        value: "true"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_BEAM_SIZE
        value: "1"
      - key: WHISPER_CPU_THREADS
        value: "2"
      - key: WHISPER_NUM_WORKERS
        value: "1"
      # Previews stay on; busy previews are skipped so free-tier health checks stay green.
      - key: WHISPER_PREVIEW_ENABLED
        value: "true"
      - key: WHISPER_WARMUP_ON_START
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: POS_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: AUDIO_STORAGE_DIR
        value: /tmp/storelisten-audio
      - key: REDIS_EVENT_BUS_ENABLED
        value: "false"

  - type: web
    runtime: static
    name: store-listen-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://store-listen-api-z8yb.onrender.com
      - key: VITE_WS_URL
        value: wss://store-listen-api-z8yb.onrender.com
