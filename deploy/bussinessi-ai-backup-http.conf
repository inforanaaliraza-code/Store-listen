server {
    listen 80;
    listen [::]:80;
    server_name bussinessi-ai-backup.82.29.180.169.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 200 "TLS certificate setup in progress\n";
        add_header Content-Type text/plain;
    }
}
