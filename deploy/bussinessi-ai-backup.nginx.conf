server {
    listen 80;
    listen [::]:80;
    server_name bussinessi-ai-backup.82.29.180.169.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bussinessi-ai-backup.82.29.180.169.nip.io;

    ssl_certificate /etc/letsencrypt/live/bussinessi-ai-backup.82.29.180.169.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bussinessi-ai-backup.82.29.180.169.nip.io/privkey.pem;
    client_max_body_size 25m;

    root /opt/bussinessi-ai-backup/frontend/dist;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
